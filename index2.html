<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>怜夏のホームページ</title>
  <style>
    body {
      font-family: "Helvetica", sans-serif;
      background-color: #f5f5f5;
      color: #333;
      text-align: center;
      padding: 50px;
    }
    .card {
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }
    img {
      border-radius: 50%;
      width: 150px;
      height: 150px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>こんにちは、怜夏です！</h1>
    <img src="https://via.placeholder.com/150" alt="プロフィール画像">
    <p>趣味は動画編集と語学学習。<br>
    最近はHTMLとGitHubの勉強中です！</p>
    <p>🌸 よろしくお願いします 🌸</p>
  </div>
</body>
</html>
